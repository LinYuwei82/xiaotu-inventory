name: Windows build

# 编得过 + 用例过 + 产出 Windows 安装包。
# 安装包默认未签名：只有配置了证书 secret 才会调用 signtool，并在 SIGNING.txt 里如实记录；
# 未配置时明确打印「未签名」，不会把未签名产物当成已签名。
# 安装/卸载的真实行为仍需在 Windows 机器上人工跑一次，CI 只保证能编出包。
on:
  push:
    branches: [main]
    tags:
      - 'v*'
  pull_request:
    branches: [main]
    paths:
      - 'core/**'
      - 'server/**'
      - 'web/**'
      - 'shell/**'
      - 'tests/**'
      - 'tools/**'
      - 'cmake/**'
      - 'packaging/**'
      - 'deploy/**'
      - 'CMakeLists.txt'
      - 'CMakePresets.json'
      - 'VERSION.txt'
      - 'vcpkg.json'
      - '.github/workflows/**'
  # 保留 repository_dispatch 入口，供后续同步或手动触发；GITHUB_TOKEN 的 push 不会触发其它 workflow。
  repository_dispatch:
    types: [gitee-mirror]

permissions:
  contents: read

jobs:
  release-guard:
    name: 发布门禁自检
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # 三仓库共用同一份 guard.py（见 mote/docs/OSS-发布布局.md）。
      - name: 校验 guard 未被单独改动
        run: sha256sum -c tools/release/guard.sha256
      - name: guard selftest
        run: python3 tools/release/guard.py selftest
      - name: 发布脚本布局检查
        run: python3 tools/release/test_release_layout.py
      - name: 发布/门禁单元测试
        run: |
          for t in test_release_tag test_version_bump test_guard test_publish_release; do
            python3 tools/release/$t.py
          done

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # GitHub 托管 runner 默认没有把 cl.exe 放进 PATH，而仓库的 windows-release
      # preset 用 Ninja。这个 action 只调用 runner 自带的 vcvars64.bat 设置 MSVC 环境，
      # 不安装额外工具链；CMake、Ninja 均由 windows-latest 预装。
      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      # Ed25519 验签依赖 OpenSSL 3.0，CMake 侧已改为 REQUIRED：这里必须装上真实库，
      # 否则配置阶段就会失败（而不是悄悄编成 stub）。Chocolatey 的 openssl 包安装到
      # Program Files\OpenSSL-Win64；把 bin 加进 PATH，测试运行时才能找到
      # libcrypto-3-x64.dll。
      - name: Install OpenSSL 3
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # 固定 3.x：choco 的 openssl 包已升到 4.x，ABI 与 3.x 不兼容，运行时找的是 libcrypto-3-x64.dll。
          choco install openssl --version=3.6.2 --allow-downgrade --yes --no-progress
          $root = $null
          foreach ($p in @("$env:ProgramFiles\OpenSSL-Win64", "$env:ProgramFiles\OpenSSL")) {
            if (Test-Path (Join-Path $p 'include\openssl\evp.h')) { $root = $p; break }
          }
          if (-not $root) { throw '未找到 OpenSSL 安装目录（include\openssl\evp.h）' }
          $ver = (& (Join-Path $root 'bin\openssl.exe') version) -join ' '
          if ($ver -notmatch '^OpenSSL 3\.') { throw "OpenSSL 版本不是 3.x：$ver" }
          "OPENSSL_ROOT_DIR=$root" | Out-File -FilePath $env:GITHUB_ENV -Append
          Join-Path $root 'bin' | Out-File -FilePath $env:GITHUB_PATH -Append
          Write-Host "OpenSSL：$ver（$root）"

      - name: 计算构建号
        shell: bash
        run: echo "XIAOTU_BUILD=$(date -u +%Y%m%d%H%M)" >> "$GITHUB_ENV"

      - name: Configure
        run: cmake --preset windows-release -DXIAOTU_RELEASE_BUILD=ON -DXIAOTU_BUILD=${{ env.XIAOTU_BUILD }}

      - name: Build
        run: cmake --build --preset windows-release

      - name: Test
        run: ctest --test-dir build/windows --output-on-failure --output-junit build/windows/ctest-results.xml

      - name: Upload Windows test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-ctest-junit
          path: build/windows/ctest-results.xml
          if-no-files-found: warn
          retention-days: 14

      # 壳是独立工程；这里只验证能编译，不打包、不签名。
      - name: Fetch WebView2 SDK
        shell: pwsh
        run: ./shell/win/fetch-webview2.ps1

      - name: Configure Windows shell
        run: cmake -S shell/win -B shell/win/build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build Windows shell
        run: cmake --build shell/win/build

      - name: Install Inno Setup
        run: choco install innosetup --yes --no-progress

      # 签名是参数化空位：有证书 secret 才加 /DSign=1 与 /Ssigntool；
      # 没有就跳过，并把「未签名」写进产物说明，避免被误当成已签名分发。
      # 该路径需要可导出的 PFX；Certum SimplySign 云证书无法在托管 runner 使用，
      # 需自托管 runner 或改用带 API 的云签名（见 packaging/win/README.md）。
      - name: Build Windows installer
        shell: pwsh
        env:
          CERT_PFX_BASE64: ${{ secrets.WINDOWS_CERT_PFX_BASE64 }}
          CERT_PFX_PASSWORD: ${{ secrets.WINDOWS_CERT_PFX_PASSWORD }}
        run: |
          $ErrorActionPreference = 'Stop'
          $version = (Get-Content VERSION.txt -Raw).Trim()
          New-Item -ItemType Directory -Force dist | Out-Null
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path -LiteralPath $iscc)) {
            throw "未找到 Inno Setup 编译器：$iscc"
          }

          $isccArgs = @("/DAppVersion=$version")
          $pfxPath = Join-Path $env:RUNNER_TEMP 'xiaotu-codesign.pfx'
          if ($env:CERT_PFX_BASE64) {
            $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" `
              -ErrorAction SilentlyContinue | Sort-Object FullName -Descending | Select-Object -First 1
            if (-not $signtool) {
              throw '配置了证书 secret，但未找到 signtool.exe，无法签名'
            }
            [IO.File]::WriteAllBytes($pfxPath, [Convert]::FromBase64String($env:CERT_PFX_BASE64))
            # 先签包内两个 exe：Inno 只签安装包与卸载器，不会回签已复制的 exe。
            $exeFiles = @(
              'build\windows\server\xiaotu-server.exe',
              'shell\win\build\xiaotu-shell.exe'
            ) | Where-Object { Test-Path -LiteralPath $_ }
            & packaging\win\sign.ps1 -PfxPath $pfxPath -PfxPassword $env:CERT_PFX_PASSWORD -Files $exeFiles
            if ($LASTEXITCODE -ne 0) {
              throw "签名 Windows exe 失败（退出码 $LASTEXITCODE）"
            }
            $signCommand = '/Ssigntool="{0}" sign /fd SHA256 /f "{1}" /p "{2}" /tr http://timestamp.digicert.com /td SHA256 $f' `
              -f $signtool.FullName, $pfxPath, $env:CERT_PFX_PASSWORD
            $isccArgs += '/DSign=1'
            $isccArgs += $signCommand
            '已签名：检测到证书 secret，xiaotu-server.exe、xiaotu-shell.exe、安装包与卸载器均由 signtool 签名。' |
              Out-File dist\SIGNING.txt -Encoding utf8
            Write-Host '签名：已配置证书 secret，开始签名'
          } else {
            '未签名：未配置 WINDOWS_CERT_PFX_BASE64，本产物为未签名安装包，不可对外分发。' |
              Out-File dist\SIGNING.txt -Encoding utf8
            Write-Host '未签名：未配置证书 secret，本次不调用 signtool（产物为未签名安装包）'
          }

          & $iscc @isccArgs 'packaging\win\xiaotu-inventory.iss'
          if ($LASTEXITCODE -ne 0) {
            throw "Inno Setup 编译失败（退出码 $LASTEXITCODE）"
          }
          if ($env:CERT_PFX_BASE64) {
            $setup = Get-ChildItem dist\*-setup.exe |
              Sort-Object LastWriteTime -Descending | Select-Object -First 1
            if (-not $setup) {
              throw '未找到安装包，无法校验签名'
            }
            & $signtool.FullName verify /pa /v $setup.FullName
            if ($LASTEXITCODE -ne 0) {
              throw '安装包 Authenticode 校验失败'
            }
          }
          if (Test-Path -LiteralPath $pfxPath) {
            Remove-Item -LiteralPath $pfxPath -Force
          }

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: xiaotu-win-installer
          path: |
            dist/*.exe
            dist/SIGNING.txt
          if-no-files-found: error
          retention-days: 14

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: 计算构建号
        shell: bash
        run: echo "XIAOTU_BUILD=$(date -u +%Y%m%d%H%M)" >> "$GITHUB_ENV"

      # macOS 自带的是 LibreSSL，必须用 Homebrew 的 OpenSSL 3（CMake 侧已 REQUIRED）。
      # 预设里 CMAKE_*_COMPILER_LAUNCHER=ccache，runner 镜像不带，需自行安装。
      - name: Install OpenSSL 3
        run: |
          brew list openssl@3 >/dev/null 2>&1 || brew install openssl@3
          brew list ccache >/dev/null 2>&1 || brew install ccache
          echo "OPENSSL_ROOT_DIR=$(brew --prefix openssl@3)" >> "$GITHUB_ENV"

      - name: Configure
        run: cmake --preset macos-release -DXIAOTU_RELEASE_BUILD=ON -DXIAOTU_BUILD=${{ env.XIAOTU_BUILD }}

      - name: Build
        run: cmake --build --preset release

      - name: Test
        run: ctest --preset release --output-on-failure

      # 只做校验，不打包、不签名、不公证。
      - name: Repository checks
        run: bash tools/ci/check.sh --quick
