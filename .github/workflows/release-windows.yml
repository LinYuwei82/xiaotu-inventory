name: Windows 发布

# 手动触发的 Windows 发布流水线：
#   构建服务端与壳 → 绿色包/安装包 → guard 门禁 → 生成并签名 manifest.json（v2）
#   → 上传 OSS（含发行说明页，清单写 notes_url）→ guard 线上校验
#   → 创建 GitHub / Gitee Release（附件与 OSS 发布名一致；dry_run 跳过上传与 Release）
#
# 前置 secrets：
#   OSS_ACCESS_KEY_ID / OSS_ACCESS_KEY_SECRET   仅授予 xiaotu/ 前缀 PutObject
#   XIAOTU_UPDATE_SIGNING_KEY                   Ed25519 私钥 PEM（update_signing_2026.pem 内容）
#   GITEE_TOKEN                                 Gitee 令牌（releases + 附件上传权限）
#
# 注意：
#   - 发布前先改仓库根目录的 VERSION.txt（必须大于线上版本），guard 会拒绝版本回退；
#   - 安装包 immutable 长缓存，同名覆盖不会生效；
#   - tag 触发时 build = tag 序号（必须大于已发布值）；手动触发必须显式填写 build；
#   - 发行说明页约定为 docs/release-notes-<版本>.html（缺页时清单不写 notes_url，不阻断发布）；
#   - Release 说明正文取 docs/release-notes-<版本>.md（两份都要有，CI 才算完整）。

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      build:
        description: 构建号（手动触发必填，等于发布 tag 序号；正式发布请用 tag v<semver>+<seq>）
        required: false
        default: ""
      channel:
        description: 发布通道
        type: choice
        options: [stable, beta]
        default: stable
      dry_run:
        description: 只构建与 guard，不上传、不写清单
        type: boolean
        default: false

permissions:
  contents: write   # 创建/更新 GitHub Release 需要写权限（Gitee 走 GITEE_TOKEN）

# Windows 英文 runner 默认 cp1252，Python 打印中文会崩；统一 UTF-8 输出
env:
  PYTHONUTF8: "1"
  PYTHONIOENCODING: utf-8

jobs:
  release:
    name: 构建 → 门禁 → 签名 → 上传
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 校验 guard / manifest_v2 未被单独改动
        shell: bash
        run: |
          tr -d '\r' < tools/release/guard.sha256 | sha256sum -c -
          tr -d '\r' < tools/release/manifest_v2.sha256 | sha256sum -c -
      - name: guard / manifest_v2 selftest
        shell: pwsh
        run: |
          python tools/release/guard.py selftest
          python tools/release/manifest_v2.py selftest

      # 与 windows-build.yml 相同的构建环境
      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install OpenSSL 3
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          function Find-OpenSsl3 {
            foreach ($p in @("$env:ProgramFiles\OpenSSL-Win64", "$env:ProgramFiles\OpenSSL")) {
              $exe = Join-Path $p 'bin\openssl.exe'
              if ((Test-Path (Join-Path $p 'include\openssl\evp.h')) -and (Test-Path $exe)) {
                $v = (& $exe version) -join ' '
                if ($v -match '^OpenSSL 3\.') { return [pscustomobject]@{ Root = $p; Ver = $v } }
              }
            }
            return $null
          }
          # windows-latest 已预装 OpenSSL 3.x。choco 的 openssl 包指向 slproweb 的安装文件，
          # 上游随时会删旧版（2026-11-21 的 3.6.2 就 404），所以先找预装，找不到才装。
          $found = Find-OpenSsl3
          if (-not $found) {
            foreach ($ver in @('3.6.2', '3.5.4', '3.4.1')) {
              choco install openssl --version=$ver --allow-downgrade --yes --no-progress
              # choco 失败时 $LASTEXITCODE=1 会被 Actions 的 pwsh 包装器当步骤退出码，必须清零
              $global:LASTEXITCODE = 0
              $found = Find-OpenSsl3
              if ($found) { break }
            }
          }
          if (-not $found) { throw '未找到可用的 OpenSSL 3.x（预装与 choco 均失败）' }
          "OPENSSL_ROOT_DIR=$($found.Root)" | Out-File -FilePath $env:GITHUB_ENV -Append
          Join-Path $found.Root 'bin' | Out-File -FilePath $env:GITHUB_PATH -Append
          Write-Host "OpenSSL：$($found.Ver)（$($found.Root)）"
          exit 0

      - name: Fetch WebView2 SDK
        shell: pwsh
        run: ./shell/win/fetch-webview2.ps1

      - name: 读版本与构建号
        shell: bash
        run: |
          VERSION=$(tr -d '[:space:]' < VERSION.txt)
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            eval "$(python3 tools/release/release_tag.py parse --ensure-latest --tag "${GITHUB_REF_NAME}" --emit sh)"
            echo "构建号来自 tag：${GITHUB_REF_NAME} → ${BUILD}"
          else
            BUILD="${{ inputs.build }}"
            if [ -z "$BUILD" ]; then
              echo "手动触发必须提供 build 参数；正式发布请用 tag v<semver>+<seq>" >&2
              exit 2
            fi
          fi
          CHANNEL="${{ inputs.channel || 'stable' }}"
          if [ -z "$CHANNEL" ]; then CHANNEL=stable; fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "BUILD=$BUILD" >> "$GITHUB_ENV"
          echo "CHANNEL=$CHANNEL" >> "$GITHUB_ENV"
          echo "版本 $VERSION，构建号 $BUILD，通道 $CHANNEL"

      - name: 校验版本 / 构建号递增
        shell: bash
        run: |
          python3 tools/release/check_version_bump.py --product xiaotu \
            --build "$BUILD" \
            --manifest-url "https://dl.xiaotu.online/xiaotu/updates/$CHANNEL/manifest.json"

      - name: 构建服务端
        run: |
          cmake --preset windows-release -DXIAOTU_RELEASE_BUILD=ON -DXIAOTU_BUILD=${{ env.BUILD }}
          cmake --build --preset windows-release

      - name: 构建壳
        run: |
          cmake -S shell/win -B shell/win/build -G Ninja -DCMAKE_BUILD_TYPE=Release -DXIAOTU_RELEASE_BUILD=ON -DXIAOTU_BUILD=${{ env.BUILD }}
          cmake --build shell/win/build

      # 壳内嵌的清单地址必须与本次发布一致；guard 在后面会再验一次
      - name: 校验壳内清单地址
        shell: pwsh
        run: |
          $exe = 'shell\win\build\xiaotu-shell.exe'
          if (-not (Test-Path $exe)) { throw "未找到 $exe" }
          $bytes = [IO.File]::ReadAllBytes($exe)
          $text = [Text.Encoding]::ASCII.GetString($bytes)
          if ($text -notlike '*xiaotu/updates/${{ inputs.channel || 'stable' }}/manifest.json*') {
            throw 'xiaotu-shell.exe 未包含当前清单地址，请检查源码后重试'
          }

      - name: 打绿色包
        shell: pwsh
        run: ./packaging/win/make-zip.ps1

      - name: 打安装包
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          choco install innosetup --yes --no-progress
          New-Item -ItemType Directory -Force dist | Out-Null
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path -LiteralPath $iscc)) { throw "未找到 ISCC：$iscc" }
          & $iscc "/DAppVersion=${{ env.VERSION }}" 'packaging\win\xiaotu-inventory.iss'
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup 编译失败（$LASTEXITCODE）" }

      # guard.py 需要 innounp 解包 setup.exe 做 build stamp 校验
      # 原版 innounp 0.50 只支持 ISCC ≤ 6.1，innounp-2 fork 支持 6.7+
      - name: 安装 innounp
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # 上游的日期 tag 会消失（原来的 2026-07-21 已 404），钉到具体 commit，
          # 避免源失效再次卡住发布；innounp-2.zip 是该 fork 目录下的最新构建。
          $ref = '418937d9913c67b9abbe93a2e9e725a06f0f2be7'
          $url = "https://raw.githubusercontent.com/jrathlev/InnoUnpacker-Windows-GUI/$ref/innounp-2/bin/innounp-2.zip"
          $dest = Join-Path $env:RUNNER_TEMP 'innounp'
          New-Item -ItemType Directory -Force $dest | Out-Null
          $zip = Join-Path $dest 'innounp.zip'
          Invoke-WebRequest -Uri $url -OutFile $zip -UseBasicParsing
          Expand-Archive -Path $zip -DestinationPath $dest -Force
          $exe = Join-Path $dest 'innounp.exe'
          if (-not (Test-Path $exe)) { throw "innounp 解包后未找到 innounp.exe" }
          # 放到 ~/.local-bin（guard.py _find_innounp 候选位置之一）
          $localBin = Join-Path $HOME '.local-bin'
          New-Item -ItemType Directory -Force $localBin | Out-Null
          Copy-Item $exe $localBin
          $localBin | Out-File -FilePath $env:GITHUB_PATH -Append
          & $exe 2>&1 | Select-Object -First 1
          Write-Host "innounp 已部署到 $localBin"

      - name: 生成并签名 manifest.json（v2）
        shell: pwsh
        env:
          XIAOTU_UPDATE_SIGNING_KEY: ${{ secrets.XIAOTU_UPDATE_SIGNING_KEY }}
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force dist | Out-Null
          $keyPath = Join-Path $env:RUNNER_TEMP 'update_signing.pem'
          [IO.File]::WriteAllText($keyPath, $env:XIAOTU_UPDATE_SIGNING_KEY.Replace("`n", "`r`n"))
          $v = '${{ env.VERSION }}'; $b = '${{ env.BUILD }}'
          # 发行说明页随发布上传到 OSS；清单里写 notes_url，客户端「更新说明」直接可打开
          $notesFile = "docs/release-notes-$v.html"
          $notesArgs = @()
          if (Test-Path -LiteralPath $notesFile) {
            $notesUrl = "https://dl.xiaotu.online/xiaotu/release-notes-$v.html"
            $notesArgs = @('--notes-url', $notesUrl)
            Write-Host "清单写 notes_url：$notesUrl"
          } else {
            Write-Host "未找到 $notesFile：清单不写 notes_url（不阻断发布）"
          }
          python tools/release/manifest_v2.py generate `
            --product xiaotu --channel ${{ inputs.channel || 'stable' }} --platform windows `
            --version $v --build $b --min-os 10.0 --key-id 2026-11 `
            --artifact "setup=dist/xiaotu-inventory-$v-win64-setup.exe" `
            --artifact "portable=dist/xiaotu-inventory-$v-win64.zip" `
            --key $keyPath --out dist/manifest.json @notesArgs
          python tools/release/manifest_v2.py verify `
            --manifest dist/manifest.json --key $keyPath `
            --artifact "setup=dist/xiaotu-inventory-$v-win64-setup.exe" `
            --artifact "portable=dist/xiaotu-inventory-$v-win64.zip"
          $pubHex = (python tools/release/manifest_v2.py pubkey --key $keyPath) -replace '.*：', ''
          "PUB_HEX=$pubHex" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: guard preflight（v2）
        shell: pwsh
        run: |
          $v = '${{ env.VERSION }}'; $b = '${{ env.BUILD }}'
          python tools/release/guard.py preflight `
            --product xiaotu --kind win --channel ${{ inputs.channel || 'stable' }} `
            --file "dist/xiaotu-inventory-$v-win64-setup.exe" `
            --name "xiaotu-$v-win64-setup.exe" `
            --zip "dist/xiaotu-inventory-$v-win64.zip" `
            --zip-name "xiaotu-$v-win64-portable.zip" `
            --schema v2 --manifest dist/manifest.json --pub-hex ${{ env.PUB_HEX }} --build $b

      # ---- 以下为上传段：dry_run 到此为止 ----
      - name: 上传 OSS
        if: ${{ inputs.dry_run != true }}
        shell: pwsh
        env:
          OSS_ACCESS_KEY_ID: ${{ secrets.OSS_ACCESS_KEY_ID }}
          OSS_ACCESS_KEY_SECRET: ${{ secrets.OSS_ACCESS_KEY_SECRET }}
        run: |
          $ErrorActionPreference = 'Stop'
          python -m pip install --quiet oss2
          $v = '${{ env.VERSION }}'
          $env:UPLOAD_SETUP = "dist/xiaotu-inventory-$v-win64-setup.exe"
          $env:UPLOAD_ZIP = "dist/xiaotu-inventory-$v-win64.zip"
          $env:UPLOAD_MANIFEST = 'dist/manifest.json'
          $notesFile = "docs/release-notes-$v.html"
          if (Test-Path -LiteralPath $notesFile) {
            $env:UPLOAD_NOTES_PATH = $notesFile
            $env:UPLOAD_NOTES_KEY = "xiaotu/release-notes-$v.html"
          }
          $env:CHANNEL = '${{ inputs.channel || 'stable' }}'
          $py = @'
          import os, oss2
          ak, sk = os.environ["OSS_ACCESS_KEY_ID"], os.environ["OSS_ACCESS_KEY_SECRET"]
          endpoint = "https://oss-cn-hongkong.aliyuncs.com"
          bkt = oss2.Bucket(oss2.Auth(ak, sk), endpoint, "xiaotu-update")
          jobs = [
              ("UPLOAD_SETUP", "xiaotu/xiaotu-{v}-win64-setup.exe",
               "application/octet-stream", "public, max-age=31536000, immutable"),
              ("UPLOAD_ZIP", "xiaotu/xiaotu-{v}-win64-portable.zip",
               "application/zip", "public, max-age=31536000, immutable"),
              ("UPLOAD_MANIFEST", "xiaotu/updates/{ch}/manifest.json",
               "application/json", "no-cache, max-age=60"),
          ]
          for env_key, key_tpl, ct, cc in jobs:
              key = key_tpl.format(v=os.environ["VERSION"], ch=os.environ["CHANNEL"])
              with open(os.environ[env_key], "rb") as f:
                  bkt.put_object(key, f, headers={"Cache-Control": cc, "Content-Type": ct})
              print(f"  OK {key}")
          notes = os.environ.get("UPLOAD_NOTES_PATH")
          if notes:
              key = os.environ["UPLOAD_NOTES_KEY"]
              bkt.put_object_from_file(key, notes, headers={
                  "Cache-Control": "public, max-age=3600",
                  "Content-Type": "text/html; charset=utf-8"})
              print(f"  OK {key}")
          '@
          $py | Out-File "$env:RUNNER_TEMP\upload.py" -Encoding utf8
          python "$env:RUNNER_TEMP\upload.py"

      - name: guard verify-live（v2）
        if: ${{ inputs.dry_run != true }}
        shell: pwsh
        run: |
          $v = '${{ env.VERSION }}'; $b = '${{ env.BUILD }}'
          python tools/release/guard.py verify-live `
            --product xiaotu --kind win --channel ${{ inputs.channel || 'stable' }} `
            --file "dist/xiaotu-inventory-$v-win64-setup.exe" `
            --name "xiaotu-$v-win64-setup.exe" `
            --zip "dist/xiaotu-inventory-$v-win64.zip" `
            --zip-name "xiaotu-$v-win64-portable.zip" `
            --schema v2 --pub-hex ${{ env.PUB_HEX }} --build $b
          $notesUrl = "https://dl.xiaotu.online/xiaotu/release-notes-$v.html"
          if (Test-Path -LiteralPath "docs/release-notes-$v.html") {
            $code = (Invoke-WebRequest -Uri $notesUrl -Method Head -UseBasicParsing).StatusCode
            if ($code -ne 200) { throw "说明页不可访问：$notesUrl（HTTP $code）" }
            Write-Host "说明页可访问：$notesUrl"
          }

      # GitHub 用工作流自带 token（contents: write），Gitee 用仓库 secret GITEE_TOKEN。
      # 附件优先取 dist/ 里本次构建的包，缺 macOS 包时从 OSS 回源（单平台发版则跳过）。
      - name: 创建 GitHub / Gitee Release
        if: ${{ inputs.dry_run != true }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          REQUIRE_GITEE: "true"
          ALLOW_MISSING_ATTACHMENTS: "true"
          SKIP_TAG_PUSH: "true"
          TAG: v${{ env.VERSION }}+${{ env.BUILD }}
          NOTES_FILE: docs/release-notes-${{ env.VERSION }}.md
        run: bash tools/release/publish_release.sh

      - name: 上传构建产物（留档）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xiaotu-windows-release
          path: |
            dist/*.exe
            dist/*.zip
            dist/manifest.json
          if-no-files-found: warn
          retention-days: 14
