name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: 安装构建工具
        run: brew install cmake ninja
      - name: 准备代码生成虚拟环境
        run: |
          python3 -m venv tools/codegen/.venv
          tools/codegen/.venv/bin/pip install -r tools/codegen/requirements.txt
      - name: 构建、测试、生成校验与平台泄漏检查
        run: tools/ci/check.sh

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
      - name: 配置并构建（XIAOTU_BUILD_SHELL=OFF）
        run: |
          cmake --preset windows-release
          cmake --build --preset windows-release
      - name: 运行 ctest
        run: ctest --test-dir build/windows --output-on-failure
