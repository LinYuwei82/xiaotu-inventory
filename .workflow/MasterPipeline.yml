version: '1.0'

name: ci

displayName: 小兔进销存 CI

# 只在和 main 有关的变更上跑：
#   push  → 推送到 main
#   pr    → 指向 main 的 Pull Request（含 PR 更新与评论触发）
# 其他分支推送不触发，避免占用免费核分。
triggers:
  push:
    branches:
      precise:
        - main
  pr:
    branches:
      precise:
        - main

# 同一条流水线一次只跑一条构建，后来的排队等待，不并行消耗核分。
# 任务超时 60 分钟：卡死的构建会被取消，避免一直堵住排队的后续构建。
strategy:
  blocking: true
  stepTimeout: 60

stages:
  - stage:
      name: verify
      displayName: 编译与测试
      strategy: naturally
      trigger: auto
      steps:
        - step: build@gcc
          name: linux_verify
          displayName: Linux 构建、测试与校验
          gccVersion: '10.3'
          # 构建缓存是平台侧配置，不会回写到本文件，仓库这份 yml 里没有缓存字段。
          # 平台「构建缓存」填的两项与 check.sh 的取值一一对应：
          #   $HOME/.cache/ccache  ← check.sh 里 CCACHE_DIR 的默认值（别写 ~，见下）
          #   build/ci-linux       ← check.sh 的 Linux 构建目录
          # 注意：多数 CI 缓存实现不会展开波浪号，填 ~/.cache/ccache 会建出字面
          # 名为 ~ 的目录而永不命中；请填 $HOME/.cache/ccache 或绝对路径。
          # check.sh 每次都会打印 CCACHE_DIR 的解析结果，便于对照平台配置。
          commands:
            # 镜像只保证 GCC 与常规工具，且自带 CMake 可能是 3.16，低于项目要求的 3.25。
            # 因此按版本判断：缺失或低于 3.25 时安装固定版本，不裸装最新版。
            - export PATH="$HOME/.local/bin:$PATH"
            - |
              set -e
              cmake_ok=0
              if command -v cmake >/dev/null 2>&1; then
                cur="$(cmake --version | sed -n 's/^cmake version \([0-9][0-9.]*\).*/\1/p' | head -n 1)"
                if [ -n "$cur" ] && [ "$(printf '%s\n%s\n' 3.25 "$cur" | sort -V | head -n 1)" = "3.25" ]; then
                  cmake_ok=1
                fi
              fi
              if [ "$cmake_ok" -ne 1 ]; then
                python3 -m pip install --user "cmake==3.31.6"
              fi
            # 检查逻辑只在本脚本里，Gitee Go 侧不复制步骤。
            # 脚本会打印系统、cmake/ninja/make/ccache 的实际版本与生成器选择。
            - bash tools/ci/check.sh
