version: '1.0'

name: ci

displayName: 小兔进销存 CI

# 只在和 main 有关的变更上跑：
#   push  → 推送到 main
#   pr    → 指向 main 的 Pull Request（含 PR 更新与评论触发）
# 其他分支推送不触发，避免占用免费核分。
triggers:
  push:
    branches:
      precise:
        - main
  pr:
    branches:
      precise:
        - main

# 同一条流水线一次只跑一条构建，后来的排队等待，不并行消耗核分。
strategy:
  blocking: true

stages:
  - stage:
      name: verify
      displayName: 编译与测试
      strategy: naturally
      trigger: auto
      steps:
        - step: build@gcc
          name: linux_verify
          displayName: Linux 构建、测试与校验
          gccVersion: '10.3'
          # 构建缓存是平台侧配置，不会回写到本文件，仓库这份 yml 里没有缓存字段。
          # 平台「构建缓存」填的两项与 check.sh 的取值一一对应：
          #   $HOME/.cache/ccache  ← check.sh 里 CCACHE_DIR 的默认值（别写 ~，见下）
          #   build/ci-linux       ← check.sh 的 Linux 构建目录
          # 注意：多数 CI 缓存实现不会展开波浪号，填 ~/.cache/ccache 会建出字面
          # 名为 ~ 的目录而永不命中；请填 $HOME/.cache/ccache 或绝对路径。
          # check.sh 每次都会打印 CCACHE_DIR 的解析结果，便于对照平台配置。
          commands:
            # 镜像只保证 GCC 与常规工具；CMake 缺失时用 pip 安装到用户目录。
            - export PATH="$HOME/.local/bin:$PATH"
            - command -v cmake >/dev/null 2>&1 || python3 -m pip install --user cmake
            # 检查逻辑只在本脚本里，Gitee Go 侧不复制步骤。
            # 脚本会打印系统、cmake/ninja/make/ccache 的实际版本与生成器选择。
            - bash tools/ci/check.sh
