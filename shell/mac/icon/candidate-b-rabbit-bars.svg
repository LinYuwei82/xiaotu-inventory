<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-label="方案 B：兔耳柱状与库存堆叠">
  <defs>
    <linearGradient id="b-bg" x1="0" y1="0" x2="0.7" y2="1">
      <stop offset="0" stop-color="#10A37F"/>
      <stop offset="1" stop-color="#0B6B57"/>
    </linearGradient>
  </defs>

  <rect x="92" y="92" width="840" height="840" rx="188" fill="url(#b-bg)"/>

  <!-- 库存基线 -->
  <rect x="222" y="786" width="580" height="30" rx="15" fill="#FFF6E4"/>

  <!-- 库存柱体：刻线表示堆叠箱体 -->
  <g fill="#FFF6E4">
    <rect x="248" y="606" width="120" height="180" rx="26" opacity="0.62"/>
    <rect x="392" y="496" width="120" height="290" rx="26" opacity="0.78"/>
  </g>
  <g fill="#0B6B57" opacity="0.55">
    <rect x="248" y="666" width="120" height="10"/>
    <rect x="248" y="726" width="120" height="10"/>
    <rect x="392" y="556" width="120" height="10"/>
    <rect x="392" y="616" width="120" height="10"/>
    <rect x="392" y="676" width="120" height="10"/>
  </g>

  <!-- 兔头与兔耳立在库存基线上，耳朵外张 -->
  <g fill="#FFF6E4">
    <rect x="566" y="262" width="94" height="350" rx="47" transform="rotate(-12 613 612)"/>
    <rect x="676" y="214" width="94" height="400" rx="47" transform="rotate(12 723 614)"/>
    <circle cx="650" cy="688" r="108"/>
  </g>
  <g fill="#FF9FB2">
    <rect x="590" y="292" width="46" height="276" rx="23" transform="rotate(-12 613 612)"/>
    <rect x="700" y="244" width="46" height="316" rx="23" transform="rotate(12 723 614)"/>
  </g>
</svg>
