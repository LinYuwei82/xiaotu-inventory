<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-label="方案 C：负空间兔形与仓库货架">
  <defs>
    <linearGradient id="c-bg" x1="0" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#14594A"/>
      <stop offset="1" stop-color="#0A342B"/>
    </linearGradient>
    <mask id="c-cut">
      <rect x="196" y="196" width="632" height="632" rx="150" fill="#FFFFFF"/>
      <!-- 负空间：兔耳、兔头 -->
      <g fill="#000000">
        <rect x="436" y="248" width="70" height="290" rx="35" transform="rotate(-7 471 520)"/>
        <rect x="526" y="222" width="70" height="316" rx="35" transform="rotate(7 561 520)"/>
        <circle cx="500" cy="520" r="120"/>
        <!-- 货架横档 -->
        <rect x="248" y="660" width="528" height="20" rx="10"/>
        <rect x="248" y="740" width="528" height="20" rx="10"/>
        <!-- 货架上的周转箱 -->
        <rect x="604" y="694" width="140" height="46" rx="12"/>
      </g>
    </mask>
  </defs>

  <rect x="92" y="92" width="840" height="840" rx="188" fill="url(#c-bg)"/>
  <rect x="196" y="196" width="632" height="632" rx="150" fill="#FDF6E3" mask="url(#c-cut)"/>
</svg>
