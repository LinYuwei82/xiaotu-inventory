<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-label="方案 A：兔头与条码单据">
  <defs>
    <linearGradient id="a-bg" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0" stop-color="#5B4BE0"/>
      <stop offset="1" stop-color="#3B2AAE"/>
    </linearGradient>
    <linearGradient id="a-card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#231C58"/>
      <stop offset="1" stop-color="#141034"/>
    </linearGradient>
  </defs>

  <!-- 图标本体：四周留 92 的安全边距 -->
  <rect x="92" y="92" width="840" height="840" rx="188" fill="url(#a-bg)"/>

  <!-- 单据卡片：轻微倾斜，作为「进销存」的载体 -->
  <g transform="rotate(5 572 512)">
    <rect x="392" y="252" width="380" height="524" rx="46" fill="#0E0B26" opacity="0.35"/>
    <rect x="392" y="238" width="380" height="524" rx="46" fill="url(#a-card)"/>
    <rect x="436" y="272" width="306" height="92" rx="26" fill="#3A33A0"/>
    <rect x="470" y="300" width="150" height="18" rx="9" fill="#CFC8FF" opacity="0.85"/>
    <rect x="470" y="328" width="96" height="14" rx="7" fill="#8F86F0" opacity="0.7"/>

    <!-- 条码 -->
    <g fill="#F6F3FF">
      <rect x="470" y="548" width="16" height="150" rx="4"/>
      <rect x="500" y="548" width="8" height="150" rx="3"/>
      <rect x="522" y="548" width="20" height="150" rx="4"/>
      <rect x="556" y="548" width="8" height="150" rx="3"/>
      <rect x="578" y="548" width="14" height="150" rx="4"/>
      <rect x="606" y="548" width="22" height="150" rx="4"/>
      <rect x="642" y="548" width="8" height="150" rx="3"/>
      <rect x="664" y="548" width="18" height="150" rx="4"/>
      <rect x="696" y="548" width="10" height="150" rx="3"/>
    </g>
    <rect x="470" y="716" width="150" height="16" rx="8" fill="#8F86F0" opacity="0.6"/>
  </g>

  <!-- 兔耳与兔头：白色剪影压在卡片边缘，兼顾浅色与深色背景 -->
  <g fill="#FFF8F1">
    <rect x="202" y="172" width="86" height="306" rx="43" transform="rotate(-13 245 474)"/>
    <rect x="310" y="146" width="86" height="330" rx="43" transform="rotate(9 353 474)"/>
    <circle cx="318" cy="528" r="150"/>
  </g>
  <g fill="#FFB7CE">
    <rect x="224" y="204" width="42" height="238" rx="21" transform="rotate(-13 245 474)"/>
    <rect x="332" y="180" width="42" height="256" rx="21" transform="rotate(9 353 474)"/>
  </g>
</svg>
